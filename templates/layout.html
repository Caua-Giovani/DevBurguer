<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevBurger - Flex & Grid 2025</title>
    

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Oswald:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<!-- Incluir os links para CSS (pode ter mais arquivos ou arquivos com nomes diferentes) -->
    <link rel="stylesheet" href="/static/reset.css" />
    <link rel="stylesheet" href="/static/variables.css" />
    <link rel="stylesheet" href="/static/main.css" />
    <link rel="stylesheet" href="/static/media.css" />

    
    {% block css_adicional %}
    {% endblock %}
  </head>
  <body>

  <!-- Header e Navbar -->
    <header class="header">
      <div class="header__container">
        <a href="/" class="header__logo">DevBurger</a>

        <nav class="header__nav">
          <ul class="header__menu">
            <li class="header__item">
              <a href="/" class="header__link">Home</a>
            </li>
            <li class="header__item">
              <a href="/cardapio" class="header__link">Cardápio</a>
            </li>
            <li class="header__item">
              <a href="" class="header__link">Meu Carrinho</a>
            </li>
            <li class="header__item">
              <a href="/contato" class="header__link">Contato</a>
            </li>
          </ul>
        </nav>


        <button class="header__toggle">
          <span onclick="toggleCart()" class="material-symbols-outlined">shopping_cart</span>
        </button>
      </div>
    </header>

    {% block conteudo %}
    {% endblock %}

<!-- Rodapé -->
    <footer class="footer">
      <p class="footer__text">
        DevBurger © 2026. Todos os direitos reservados.
      </p>
    </footer>

    <aside class="cart" id="cart">

      <div class="cart__header">
        <strong style="color: black;">Seu Carrinho</strong>
        <span onclick="toggleCart()" style="cursor:pointer; color: black;">✖</span>
      </div>

      <div class="cart__items" id="cart-items">
        <!-- Itens vão aqui -->
        
      </div>

      <div class="cart__footer">
        <div class="cart__total" style="color: black;">
          <strong style="color: black;" id="cart-total">Total:</strong> R$ 37,00
        </div>

        <button class="cart__btn">
          Finalizar Pedido
        </button>
      </div>

    </aside>


    <script>
      function toggleCart() {
          const cart = document.getElementById("cart");
          cart.classList.toggle("active");
      }
    </script>
    <script src="static/aside.js"></script>
    
  </body>
</html>
