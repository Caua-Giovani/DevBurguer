{% extends "layout.html" %}

{% block css_adicional %}
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  background: #dbdbdb;
  color: #333;
}


/* CONTAINER */
.container {
  max-width: 1200px;
  margin: 40px auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  padding: 20px;
  display: flex;
  align-items: center;
}

/* IMAGEM */
.product-img {
  background: white;
  padding: 20px;
  border-radius: 20px;
  box-shadow:3px 5px 20px rgba(35, 35, 35,0.5);
  width: 75%;
  height: 100%;
}

.Salad {
  height: 700px; 
  width: 700px;
  object-fit: cover; 
  object-position: center; 
}

.Java {
  height: 700px; 
  width: 700px;
  object-fit: cover; 
  object-position: center; 
}

.Script {
  height: 600px; 
  width: 700px;
  object-fit: cover; 
  object-position: center; 
}

.product-img img {
  width: 100%;
  height: 100%;
  border-radius: 15px;
  object-fit: cover;
}

/* INFO */
.product-info {
  display: flex;
  flex-direction: column;
  gap: 15px;
  
}

.product-info h1 {
  font-size: 32px;
}

.badge {
  background: #ff3c38;
  color: white;
  padding: 5px 10px;
  border-radius: 8px;
  width: fit-content;
  font-size: 12px;
}

.description {
  color: #666;
  line-height: 1.5;
}

.price {
  font-size: 32px;
  color: #27ae60;
  font-weight: bold;
}

/* BOTÕES */
.actions {
  display: flex;
  gap: 15px;
  margin-top: 10px;
}

.button{
  padding: 12px 20px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
  transition: 0.3s;
}

.buy {
  background: #ff3c38;
  color: white;
  box-shadow:1px 3px 10px rgba(35, 35, 35, 0.4);
}

.buy:hover {
  background: #e6322e;
}

.button_cart {
  background: #2ecc71;
  color: white;
  box-shadow:1px 3px 10px rgba(35, 35, 35, 0.4);
}

.button_cart:hover {
  background: #27ae60;
}

/* DETALHES */
.details {
  margin-top: 30px;
  background: white;
  padding: 20px;
  border-radius: 15px;
  box-shadow:3px 5px 20px rgba(35, 35, 35,0.5);
}

.details h3 {
  margin-bottom: 10px;
}

.details ul {
  padding-left: 20px;
}

.details li {
  margin-bottom: 5px;
}



/* RESPONSIVO */
@media (max-width: 900px) {
  .container {
    grid-template-columns: 1fr;
  }
}
</style>
{% endblock %}

{% block conteudo %}

<div class="container">

  <!-- IMAGEM -->
  <div class="product-img {{lanches.produto}}">
    <img src="{{lanches.foto}}" alt="{{lanches.produto}}">
  </div>

  <!-- INFO -->
  <div class="product-info">

    <h1>{{lanches.produto}}</h1>

    <p class="description">
      {{lanches.descricao}}
    </p>

    <div>
      <span class="price">R$ {{lanches.preco}}0</span>
    </div>

    <div class="actions">
      <button class="buy button">Comprar agora</button>
      <a href="/carrinho/post/{{lanches.codigo}}" class="button_cart button">Adicionar ao carrinho</a>
    </div>


  </div>
  

</div>
<button class="button-logout"><a href="/logout">Sair da Conta</a></button>
{% endblock %}
